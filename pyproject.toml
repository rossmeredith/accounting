[tool.ruff]
target-version = "py310"
line-length = 88
src = ["backend"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["config"]

[tool.ruff.lint.per-file-ignores]
"**/settings*.py" = ["E501"]
"**/migrations/*.py" = ["E501"]
